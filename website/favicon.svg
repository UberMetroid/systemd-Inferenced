<?xml version="1.0" encoding="UTF-8"?>
<!--
  systemd-inferenced favicon.
  Stylised compute hardware slices with cream + #ce422b palette.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="6" y="8" width="52" height="48" rx="6" ry="6" fill="#fbf8f3" stroke="#ce422b" stroke-width="3"/>
  <!-- GPU slice -->
  <rect x="14" y="16" width="36" height="8" rx="2" fill="#ce422b"/>
  <!-- NPU slice -->
  <rect x="14" y="28" width="36" height="8" rx="2" fill="#ce422b" opacity="0.75"/>
  <!-- CPU / Emergency enclave slice -->
  <rect x="14" y="40" width="36" height="8" rx="2" fill="#ce422b" opacity="0.45"/>
</svg>
