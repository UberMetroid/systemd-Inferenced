[workspace]
resolver = "2"
members = [
    "crates/inferenced-core",
    "crates/inferenced-daemon",
    "crates/inferenctl",
    "qa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["systemd-inferenced contributors"]

[workspace.dependencies]
# Internal workspace crates
inferenced-core = { path = "crates/inferenced-core" }

# Pure Rust D-Bus (zero libdbus-1.so)
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# Pure Rust async runtime & Linux system interfaces (zero libsystemd.so)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time", "process", "sync"] }
rustix = { version = "0.38", features = ["fs", "net", "process", "event", "system", "mm"] }

# CLI & Formatting
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
colored = "2.1"
tabled = { version = "0.17", features = ["ansi"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
toml = "0.8"

# Error Handling & Utilities
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP & Gateway Proxy (OpenAI / Ollama wire protocol)
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
axum = { version = "0.7", features = ["tokio", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
