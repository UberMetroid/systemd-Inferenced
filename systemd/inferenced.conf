# /etc/systemd/inferenced.conf
# Global configuration for systemd-inferenced

[Daemon]
LogLevel=info
StateDir=/var/lib/systemd-inferenced
RunDir=/run/systemd-inferenced

[Arbiter]
# Eviction policy: "lru", "priority_first"
EvictionPolicy=priority_first
# Linux Pressure Stall Information (PSI) threshold to throttle batch inference
PsiMemorySomeThreshold=25.0
PsiMemoryFullThreshold=10.0

[Sentry]
# Reserved compute slice for systemd-sentry emergency triage
ReserveTriageEnclave=true
PreferredTriagePlane=auto   # auto detects NPU first, falls back to CPU-AMX
PinnedTriageMemoryBytes=2147483648 # 2GB
TriageSocketPath=/run/systemd-inferenced/sentry.sock

[Gateway]
# Emulate OpenAI / Ollama HTTP endpoint
EnableHttpGateway=true
HttpBindAddress=127.0.0.1:11434
UnixSocketPath=/run/systemd-inferenced/io.sock
